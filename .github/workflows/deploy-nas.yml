name: CI/CD — Build & Deploy to NAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/teylor/agenticf-api:latest
            ghcr.io/teylor/agenticf-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/teylor/agenticf-web:latest
            ghcr.io/teylor/agenticf-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-nas:
    name: Deploy to UGREEN DXP2800 (Tailscale + SSH)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}

      - name: Check Tailscale connectivity to NAS
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
        run: |
          tailscale status
          tailscale ping -c 3 "$NAS_HOST" || true

      - name: Deploy updated containers on UGREEN DXP2800
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_DEPLOY_DIR: ${{ secrets.NAS_DEPLOY_DIR }}
          NAS_SSH_PORT: ${{ secrets.NAS_SSH_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PORT="${NAS_SSH_PORT:-22}"
          for attempt in 1 2 3; do
            echo "SSH deploy attempt ${attempt} to ${NAS_HOST}:${PORT}..."
            if ssh -p "$PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes "${NAS_USER}@${NAS_HOST}" "DEPLOY_DIR='${NAS_DEPLOY_DIR:-/volume1/docker/agenticf}' GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" <<'EOF'
              set -euo pipefail
              cd "$DEPLOY_DIR"
              if [ -d .git ]; then
                git pull origin main < /dev/null
              fi
              ENV_FLAG=""
              if [ -f .env ]; then
                ENV_FLAG="--env-file .env"
              fi
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
              docker compose $ENV_FLAG -f docker/compose.nas.yml pull < /dev/null
              docker compose $ENV_FLAG -f docker/compose.nas.yml up -d postgres < /dev/null
              docker compose $ENV_FLAG -f docker/compose.nas.yml run -T --rm api node apps/api/dist/db/migrate.js < /dev/null
              docker compose $ENV_FLAG -f docker/compose.nas.yml up -d --remove-orphans < /dev/null
              docker compose $ENV_FLAG -f docker/compose.nas.yml ps < /dev/null
              if command -v curl >/dev/null 2>&1; then
                HTTP_PORT=""
                if [ -f .env ]; then
                  HTTP_PORT=$(awk -F= '/^APP_HTTP_PORT=/{val=$2} END{gsub(/[\r"]/, "", val); print val}' .env)
                fi
                HTTP_PORT="${HTTP_PORT:-8080}"
                READY_OK=0
                for _ in $(seq 1 15); do
                  if curl -fsS "http://127.0.0.1:${HTTP_PORT}/ready" >/dev/null < /dev/null; then
                    echo "Post-deploy /ready check passed on port ${HTTP_PORT}."
                    READY_OK=1
                    break
                  fi
                  sleep 2
                done
                if [ "$READY_OK" -ne 1 ]; then
                  echo "ERROR: /ready check failed on port ${HTTP_PORT} after deploy." >&2
                  exit 1
                fi
              fi
              docker image prune -f < /dev/null
          EOF
            then
              echo "Deploy succeeded!"
              exit 0
            fi
            sleep 3
          done
          exit 1
