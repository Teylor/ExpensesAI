name: agenticf-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: agenticf-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenticf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-agenticf}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agenticf_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agenticf_pgdata_dev:
