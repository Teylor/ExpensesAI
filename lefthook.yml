pre-commit:
  commands:
    protect-main:
      run: node scripts/protect-main.mjs commit

pre-push:
  parallel: false
  commands:
    protect-main:
      run: node scripts/protect-main.mjs push
    typecheck:
      run: pnpm typecheck
    lint:
      run: pnpm lint
    test:
      run: pnpm test
    secrets:
      run: pnpm security:secrets
